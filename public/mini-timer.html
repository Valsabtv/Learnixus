<!DOCTYPE html>
<html>
<head>
  <title>Mini Timer</title>
  <style>
    body {
      text-align: center;
      padding: 20px;
      font-family: sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    .light {
      background-color: #ffffff;
      color: #000000;
    }
    .dark {
      background-color: #1e293b;
      color: #f8fafc;
    }
    h2 {
      transition: color 0.3s;
    }
    .light h2 {
      color: #6366f1;
    }
    .dark h2 {
      color: #38bdf8;
    }
    #time {
      font-size: 48px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2 id="mode"></h2>
  <div id="time"></div>
  <script>
    const timeEl = document.getElementById('time');
    const modeEl = document.getElementById('mode');

    const formatTime = (seconds) => {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
    };

    const modeText = (currentMode) => {
      switch (currentMode) {
        case 'work':
          return 'Focus Session';
        case 'shortBreak':
          return 'Short Break';
        case 'longBreak':
          return 'Long Break';
        default:
          return 'Focus Session';
      }
    };

    const channel = new BroadcastChannel('pomodoro-timer');
    channel.onmessage = (e) => {
      const { timeLeft, mode } = e.data;
      timeEl.innerText = formatTime(timeLeft);
      modeEl.innerText = modeText(mode);
      document.title = `${formatTime(timeLeft)} - ${modeText(mode)}`;
    };

    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'light';
    document.body.classList.add(theme);

  </script>
</body>
</html>
