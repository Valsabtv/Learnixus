<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnixus</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/logo_learnixus_192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/logo_learnixus_180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility; /* Enhanced text rendering */
    }
    body {
      margin: 0; /* Reset default margin */
      min-height: 100vh; /* Ensure body can fill viewport height */
      background-color: #f8fafc; /* slate-50 for light theme - soft and clean */
    }
    
    .dark body {
        background-color: #020617; /* slate-950 for dark theme - deep and premium */
    }

    .amoled body {
        background-color: #000000; /* amoled theme */
    }

    /* General smooth transition for elements */
    * {
      transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms; /* Standardized transition duration */
    }
    
    /* Global focus style for accessibility - specific ring colors in components */
    *:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      /* Example: focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 */
    }


    /* Light mode scrollbar */
    ::-webkit-scrollbar {
      width: 8px; 
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9; /* slate-100 for light track */
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; /* slate-300 for light thumb */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; /* slate-400 for light thumb hover */
    }

    /* Dark mode scrollbar */
    .dark ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 for dark track */
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 for dark thumb */
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 for dark thumb hover */
    }

    /* Amoled mode scrollbar */
    .amoled ::-webkit-scrollbar-track {
      background: #1a1a1a; /* slightly lighter than black */
    }
    .amoled ::-webkit-scrollbar-thumb {
      background: #4d4d4d; /* dark grey */
      border-radius: 4px;
    }
    .amoled ::-webkit-scrollbar-thumb:hover {
      background: #666666; /* lighter grey */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); } 
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.5s ease-out forwards; 
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.97); }
    }
    .animate-fadeOut {
      animation: fadeOut 0.3s ease-in forwards; 
    }

    @keyframes appContentFadeIn {
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-appContentFadeIn {
      animation: appContentFadeIn 0.5s ease-out forwards;
    }

    @keyframes pulseSlow { 
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; } /* Slightly more subtle pulse */
    }
    .animate-pulseSlow {
      animation: pulseSlow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
